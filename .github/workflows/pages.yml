name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: actions/configure-pages@v6
      - run: npm run build:pages
        env:
          GITHUB_PAGES_BASE_PATH: /FloodRoute
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_STATIC_DEMO: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3002/FloodRoute/
          PLAYWRIGHT_SERVER_COMMAND: npm run preview:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-build/app/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v5
